<svg class="logo-badge-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MTM INOVVATION Brand Icon">
    <defs>
      <linearGradient id="hBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#258BFF"/>
        <stop offset="48%" stop-color="#4338CA"/>
        <stop offset="100%" stop-color="#7546E8"/>
      </linearGradient>
      <linearGradient id="hBadgeSheen" x1="0%" y1="0%" x2="70%" y2="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.18"/>
        <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="hSwooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38C8F5"/>
        <stop offset="45%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#F2C66D"/>
      </linearGradient>
      <filter id="hDropShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2.2" stdDeviation="2" flood-color="#040612" flood-opacity="0.9"/>
      </filter>
    </defs>
    <!-- Rounded Squircle Base -->
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#hBadgeGrad)"/>
    <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.38)" stroke-width="1.2"/>
    <!-- Specular Sheen Highlight -->
    <path d="M 2 17 C 2 8.7 8.7 2 17 2 L 47 2 C 27 2 2 27 2 47 Z" fill="url(#hBadgeSheen)"/>
    <path d="M 2 47 C 2 55.3 8.7 62 17 62 L 47 62 C 55.3 62 62 55.3 62 47 C 62 50 50 60 32 60 C 14 60 2 50 2 47 Z" fill="#0B1024" opacity="0.35"/>
    
    <!-- Bold, Sculpted 3D Geometric M-T-M Monogram -->
    <g class="header-monogram" filter="url(#hDropShadow)">
      <!-- 3D Depth Shadow Extrusion -->
      <g fill="#050812" opacity="0.9">
        <path d="M 8.5 42 L 8.5 19.5 L 13.5 19.5 L 16 27.5 L 18.5 19.5 L 23.5 19.5 L 23.5 42 L 19 42 L 19 28 L 17 33 L 15 33 L 13 28 L 13 42 Z"/>
        <path d="M 24.5 19.5 L 41.5 19.5 L 41.5 25.5 L 36 25.5 L 36 42 L 30 42 L 30 25.5 L 24.5 25.5 Z"/>
        <path d="M 42.5 42 L 42.5 19.5 L 47.5 19.5 L 50 27.5 L 52.5 19.5 L 57.5 19.5 L 57.5 42 L 53 42 L 53 28 L 51 33 L 49 33 L 47 28 L 47 42 Z"/>
      </g>
      <!-- Front Crisp White Faces with Metallic Edge Bevel -->
      <path d="M 8 40.5 L 8 18 L 13 18 L 15.5 26 L 18 18 L 23 18 L 23 40.5 L 18.5 40.5 L 18.5 26 L 16.5 31 L 14.5 31 L 12.5 26 L 12.5 40.5 Z" 
            fill="#FFFFFF" stroke="rgba(56, 200, 245, 0.95)" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M 24 18 L 41 18 L 41 24 L 35.5 24 L 35.5 40.5 L 29.5 40.5 L 29.5 24 L 24 24 Z" 
            fill="#FFFFFF" stroke="rgba(255, 255, 255, 0.95)" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M 42 40.5 L 42 18 L 47 18 L 49.5 26 L 52 18 L 57 18 L 57 40.5 L 52.5 40.5 L 52.5 26 L 50.5 31 L 48.5 31 L 46.5 26 L 46.5 40.5 Z" 
            fill="#FFFFFF" stroke="rgba(192, 132, 252, 0.95)" stroke-width="0.6" stroke-linejoin="round"/>
      
      <!-- Top Chrome Highlights -->
      <line x1="8" y1="18" x2="23" y2="18" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="24" y1="18" x2="41" y2="18" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="42" y1="18" x2="57" y2="18" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Baseline Glowing Swoosh & Core Energy Diode -->
      <path d="M 8 45.5 C 18 49.5 46 49.5 56 45.5" stroke="url(#hSwooshGrad)" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="32" cy="48" r="2.2" fill="#FFFFFF"/>
      <circle cx="32" cy="48" r="1.1" fill="#38C8F5"/>
    </g>
  </svg>